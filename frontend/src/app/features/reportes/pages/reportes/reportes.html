<div class="contenedor-reportes">

    <!-- ========================= -->
    <!-- CABECERA PRINCIPAL -->
    <!-- ========================= -->

    <div class="cabecera">

        <div>

            <h1>
                Reportes
            </h1>

            <p>
                Consulta las ventas y resultados del negocio.
            </p>

        </div>

    </div>

    <!-- ========================= -->
    <!-- PESTAÑAS DE REPORTES -->
    <!-- ========================= -->

    <mat-tab-group
        animationDuration="250ms"
        mat-stretch-tabs="false">

        <!-- ========================= -->
        <!-- REPORTE DIARIO -->
        <!-- ========================= -->

        <mat-tab label="Diario">

            <div class="contenido-pestana">

                <app-reporte-diario>
                </app-reporte-diario>

            </div>

        </mat-tab>

        <!-- ========================= -->
        <!-- REPORTE SEMANAL -->
        <!-- ========================= -->
<mat-tab label="Semanal">

    <div class="contenido-pestana">

        <app-reporte-semanal>
        </app-reporte-semanal>

    </div>

</mat-tab>
        <!-- ========================= -->
        <!-- REPORTE MENSUAL -->
        <!-- ========================= -->

        <mat-tab label="Mensual">

            <div class="contenido-pestana">

                <div class="contenido-vacio">

                    <div class="icono-vacio">

                        <mat-icon>
                            calendar_month
                        </mat-icon>

                    </div>

                    <h2>
                        Reporte mensual
                    </h2>

                    <p>
                        Aquí se mostrará el resumen completo
                        del mes seleccionado.
                    </p>

                </div>

            </div>

        </mat-tab>

    </mat-tab-group>

</div>
