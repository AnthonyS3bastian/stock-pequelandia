<aside class="sidebar">

    <div class="logo">

        <a
            class="logo-enlace"
            routerLink="/dashboard"
            aria-label="Ir al Dashboard">

            <img
                class="logo-imagen"
                src="/logo/LogoPequelandia.png"
                alt="Pequelandia A&A">

        </a>

    </div>

    <mat-divider></mat-divider>

    <nav
        class="navegacion"
        aria-label="Navegacion principal">

        <section class="grupo-menu">

            <h2>
                PRINCIPAL
            </h2>

            <mat-nav-list>

                @for (
                    item of principal;
                    track item.ruta
                ) {

                    <a
                        mat-list-item
                        [routerLink]="item.ruta"
                        routerLinkActive="activo"
                        [routerLinkActiveOptions]="{
                            exact: true
                        }">

                        <mat-icon matListItemIcon>
                            {{ item.icono }}
                        </mat-icon>

                        <span matListItemTitle>
                            {{ item.titulo }}
                        </span>

                    </a>

                }

            </mat-nav-list>

        </section>

        <section class="grupo-menu">

            <h2>
                GESTION
            </h2>

            <mat-nav-list>

                @for (
                    item of gestion();
                    track item.ruta
                ) {

                    <a
                        mat-list-item
                        [routerLink]="item.ruta"
                        routerLinkActive="activo">

                        <mat-icon matListItemIcon>
                            {{ item.icono }}
                        </mat-icon>

                        <span matListItemTitle>
                            {{ item.titulo }}
                        </span>

                    </a>

                }

            </mat-nav-list>

        </section>

    </nav>

</aside>
